services:
  app:
    build: .
    image: video-downloader:latest
    restart: unless-stopped
    env_file: .env
    # Only reachable from this server. Nginx (with HTTPS) sits in front.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Keeps the takedown blocklist and reports when the container is rebuilt.
      - ./data:/app/data
    # Stops one busy period from freezing the whole VPS. Tune for your plan.
    cpus: "1.5"
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
