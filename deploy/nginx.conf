# Nginx config for the downloader.
# Copy to /etc/nginx/sites-available/downloader, change "example.com",
# then run certbot for HTTPS (see README).

# Privacy: this log format has NO IP address and NO query string.
log_format anon '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    access_log /var/log/nginx/downloader.log anon;

    # Small request bodies only (links and forms).
    client_max_body_size 64k;

    # Big file downloads: send straight to the visitor, no extra disk copy.
    location /api/files/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors can't fake their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # "Get options" can take up to ~60 seconds on slow sites.
        proxy_read_timeout 90s;
    }
}
